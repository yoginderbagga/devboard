# Goal Push the images to DockerHub 
#
# Goal Push the images to DockerHub
name: Docker Push

on:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folders: ['backend','frontend']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Setup [Login]
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        with:
          # Keep the context at the repository root so it can see everything
          context: .
          # Explicitly point to the Dockerfile inside the matrix folder
          file: ./${{ matrix.folders }}/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-${{ matrix.folders }}:latest
          # Forces Docker to ignore old cloud runner caches and compile fresh code
          no-cache: true 

